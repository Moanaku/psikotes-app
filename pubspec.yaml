name: simulator_psikotes_it
description: App latihan psikotes kerja IT, offline-first. Soal dibuat ulang setiap sesi.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

# Versi paket adalah titik awal dan belum pernah dikompilasi (tugas T01 memverifikasi).
# Paket lain ditambahkan di tugas yang memakainya:
#   T09 drift, drift_flutter (dev: drift_dev, build_runner)  [sudah ditambahkan]
#   T17 fl_chart, share_plus  [sudah ditambahkan]
#   T18 image_picker, path_provider, shared_preferences (foto di web)  [sudah ditambahkan]
#   T19 flutter_secure_storage, file_picker  [sudah ditambahkan]
dependencies:
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  file_picker: ^11.0.3
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.4
  go_router: ^14.6.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  question_engine:
    path: packages/question_engine
  # Domain memakai Notifier dari riverpod tanpa package:flutter (T10).
  riverpod: ^2.6.1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
  assets:
    - assets/verbal_bank.json
    - assets/personality_pool.json
    - assets/knowledge_bank.json
    - assets/reading_bank.json
  # Ditambahkan di tugas yang memakainya:
