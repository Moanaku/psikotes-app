name: release-apk
# Membangun APK rilis saat tag v* dibuat dan melampirkannya ke GitHub Releases.
# Bila secret KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, dan KEY_PASSWORD
# semuanya ada, APK ditandatangani dengan keystore pemilik. Bila tidak, APK
# ditandatangani kunci debug dan catatan rilis menyebutnya terus terang.
# Langkah pemilik: docs/RILIS-APK.md. Keystore dan sandi tidak pernah ada di repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Versi di pubspec harus sama dengan tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          if [ "$tag" != "$version" ]; then
            echo "GAGAL: tag $GITHUB_REF_NAME tetapi pubspec.yaml versi $version."
            echo "Ubah 'version:' di pubspec.yaml, commit, lalu buat tag lagi."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Kode Drift (berkas .g.dart tidak di-commit)
        run: dart run build_runner build

      - name: Keystore rilis (hanya bila keempat secret ada)
        id: signing
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            keystore="$RUNNER_TEMP/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            {
              echo "storeFile=$keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Secret keystore tidak lengkap: APK ditandatangani kunci debug."
          fi

      - run: flutter build apk --release

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      - name: Catatan rilis
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          {
            if [ "$SIGNED" = "true" ]; then
              echo "APK ditandatangani dengan keystore pemilik."
            else
              echo "**Peringatan: APK ini ditandatangani kunci debug**, bukan keystore pemilik."
              echo "Aman untuk dicoba di HP sendiri, tetapi tidak bisa memperbarui app yang"
              echo "dipasang dari APK bertanda tangan lain (Android akan menolak; copot dulu,"
              echo "data app ikut hilang, ekspor backup lebih dulu). Langkah membuat keystore:"
              echo "docs/RILIS-APK.md."
            fi
            echo
            version="${GITHUB_REF_NAME#v}"
            awk -v v="$version" '
              $0 ~ "^## \[" v "\]" { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md
          } > "$RUNNER_TEMP/notes.md"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/psikotes-it-${GITHUB_REF_NAME}.apk"

      - name: Lampirkan ke GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/psikotes-it-${GITHUB_REF_NAME}.apk" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
