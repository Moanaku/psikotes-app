name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - name: SQLite untuk test database (pustaka sistem)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - name: Kode Drift (berkas .g.dart tidak di-commit)
        run: dart run build_runner build
      - run: flutter analyze
      - run: bash tool/check_tokens.sh
      - run: bash tool/check_tokens_test.sh
      - run: flutter test
      - name: Build web (folder platform ada sejak T10)
        run: flutter build web

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/question_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: Test (VM dan Chrome)
        run: dart test -p vm,chrome

  pregenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tool/pregenerate -p "test_*.py"
      - name: Validasi bank verbal bila ada
        run: if [ -f assets/verbal_bank.json ]; then python tool/pregenerate/bundle.py --check; fi
