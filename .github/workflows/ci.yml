name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: bash tool/check_tokens.sh
      - run: flutter test

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/question_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: Test (VM dan Chrome)
        run: dart test -p vm,chrome
